[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "adorm"
version = "0.0.1"
description = "Async ORM interface: an asynchronous query and model API executed by pluggable ORM drivers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jure Erznožnik" },
]
requires-python = ">=3.11"
keywords = ["orm", "async", "asyncio", "django", "postgresql", "database"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11",
]

[project.scripts]
adorm = "adorm.cli:main"

[project.optional-dependencies]
django = ["asgiref>=3.6,<4", "django>=4.2"]
asyncpg = ["asgiref>=3.6,<4", "asyncpg>=0.30", "django>=4.2", "psycopg>=3.2"]

[dependency-groups]
dev = [
    "asyncpg>=0.30",
    "coverage",
    "django>=4.2",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pytest",
    "pytest-asyncio",
    "pytest-django",
    "ruff",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/velis74/adorm"
Repository = "https://github.com/velis74/adorm"
Issues = "https://github.com/velis74/adorm/issues"

[tool.uv.build-backend]
module-name = "adorm"
module-root = ""
source-include = ["LICENSE"]

[tool.publish]
tests = "pytest"
additional_files = ["adorm/__init__.py"]

[tool.ruff]
extend-exclude = ["docs", "dist", "build", "*/migrations/*"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
]
ignore = ["E731", "E722", "C408"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# S101: assert is how a test states its claim. S301: tests unpickle only objects they pickled themselves.
# S608: tests build SQL from constant table names.
"tests/**" = ["S101", "S301", "S608"]
# PT012, PT031: what a transaction block raises depends on the whole block, so the block is inside pytest.raises().
"tests/test_transactions*.py" = ["PT012", "PT031"]
"tests/conformance/test_transactions.py" = ["PT012", "PT031"]
"tests/demo/test_memory.py" = ["PT012"]
"tests/demo/test_data.py" = ["PT012"]
# I001: generated modules sort imports for an application that installs adorm, where adorm is a third-party package.
"tests/generated/*" = ["I001"]
"demo/models/*" = ["I001"]
# N818: exception names mirror Django's (DoesNotExist, ObjectDoesNotExist …) and the executor's documented names.
"adorm/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.djangoproject.settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# Short tracebacks leave out frame arguments, which include database URLs with their passwords.
addopts = ["--strict-markers", "--tb=short"]

[tool.coverage.run]
source = ["adorm"]
branch = true

[tool.coverage.report]
show_missing = true
