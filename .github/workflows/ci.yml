name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ADORM_TEST_DATABASE_URL: postgres://adorm:adorm@localhost:5432/adorm_test
  ADORM_DEMO_REQUIRED_DRIVERS: django,asyncpg

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create the test database user
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE adorm LOGIN CREATEDB PASSWORD 'adorm'"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Role tests (CREATEROLE granted)
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c "ALTER ROLE adorm CREATEROLE"
          ADORM_TEST_CREATE_ROLES=1 uv run pytest tests/test_profiles_backends.py
      - name: Conformance suite on SQLite
        run: uv run pytest --ds=tests.djangoproject.settings_sqlite tests/conformance
      - run: uv build

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # eslint, markdownlint, vue-tsc and tsc, report only.
      - run: npm run lint
      - run: npm run docs:build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADORM_DEMO_DATABASE_URL: postgres://adorm:adorm@localhost:5432/adorm_demo
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Create the demo database user
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE adorm LOGIN CREATEDB PASSWORD 'adorm'"
      - run: uv sync --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
      - name: Create the test database user
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE adorm LOGIN CREATEDB PASSWORD 'adorm'"
      - run: uv sync --locked
      - name: Tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage run -a -m pytest --ds=tests.djangoproject.settings_sqlite tests/conformance
          psql postgres://postgres:postgres@localhost:5432/postgres -c "ALTER ROLE adorm CREATEROLE"
          ADORM_TEST_CREATE_ROLES=1 uv run coverage run -a -m pytest tests/test_profiles_backends.py
          uv run coverage json
      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: coverage.json
          extra-ignore-patterns: |
            docs/**
            demo.py
            demo/**
            scripts/**
          github-token: ${{ secrets.GITHUB_TOKEN }}
